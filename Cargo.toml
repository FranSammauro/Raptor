[package]
name = "raptor"
version = "0.1.0"
edition = "2026"
description = "Raptor - Reverse Proxy / API Gateway de alto rendimiento"

[[bin]]
name = "raptor"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "=1.10.0", features = ["v4"] }
thiserror = "1"
indexmap = "=2.2.6"
getrandom = "=0.2.15"

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
