server:
  address: 0.0.0.0:8080
  # Descomentar para servir HTTPS en vez de HTTP plano. Certificado y key
  # se cargan una sola vez al arrancar (sin reload en caliente todavía,
  # eso es Fase 6).
  # tls:
  #   cert_path: /etc/raptor/certs/fullchain.pem
  #   key_path: /etc/raptor/certs/privkey.pem
  # Sin esto, /admin/* y /metrics directamente no existen. Con esto,
  # levantan en un listener aparte -- típicamente conviene bindearlo a
  # 127.0.0.1 o a una interfaz interna, no a 0.0.0.0.
  admin:
    address: 127.0.0.1:9090

logging:
  level: info

routes:
  - path: /api/users
    upstream: users
    # Sin `auth`, la ruta queda pública. Sin `rate_limit`, sin tope.

  - path: /api/auth
    upstream: auth
    rate_limit:
      requests: 20
      window_secs: 60

  - path: /api/files
    upstream: files
    auth:
      type: api_key
      header: X-API-Key
      keys:
        - "clave-de-ejemplo-cambiar-en-produccion"

  - path: /api/admin
    upstream: users
    auth:
      type: jwt
      secret: "otro-secreto-que-hay-que-cambiar"
      issuer: raptor-auth
      audience: raptor-api
    rate_limit:
      requests: 5
      window_secs: 60

upstreams:
  users:
    load_balancer: round_robin
    timeout_ms: 5000
    retry:
      max_attempts: 2
      backoff_ms: 100
    circuit_breaker:
      failure_threshold: 5
      open_duration_secs: 30
    health_check:
      path: /health
      interval_secs: 10
      timeout_secs: 2
      healthy_threshold: 2
      unhealthy_threshold: 3
    servers:
      - http://localhost:3001
      - http://localhost:3011
      - http://localhost:3021

  auth:
    load_balancer: round_robin
    servers:
      - http://localhost:3002

  files:
    load_balancer: round_robin
    servers:
      - http://localhost:3003
