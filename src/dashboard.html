<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Raptor - Dashboard</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #161a21;
    --border: #262b35;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --healthy: #3ecf8e;
    --unhealthy: #e5534b;
    --half-open: #d7a72e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  th, td {
    text-align: left;
    padding: 10px 14px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 11px; }
  tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.healthy { background: rgba(62,207,142,0.15); color: var(--healthy); }
  .badge.unhealthy { background: rgba(229,83,75,0.15); color: var(--unhealthy); }
  .badge.closed { background: rgba(62,207,142,0.15); color: var(--healthy); }
  .badge.open { background: rgba(229,83,75,0.15); color: var(--unhealthy); }
  .badge.half_open { background: rgba(215,167,46,0.15); color: var(--half-open); }
  .section-title { font-size: 14px; color: var(--muted); margin: 24px 0 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .footer { color: var(--muted); font-size: 12px; margin-top: 32px; }
  .refresh-note { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <h1>Raptor</h1>
  <div class="subtitle">Reverse Proxy / API Gateway &mdash; <span class="refresh-note">se actualiza solo cada 3s</span></div>

  <div class="grid" id="stats-grid"></div>

  <div class="section-title">Upstreams</div>
  <table id="upstreams-table">
    <thead><tr><th>Upstream</th><th>Balanceo</th><th>Backend</th><th>Peso</th><th>Salud</th><th>Circuito</th><th>Conexiones activas</th></tr></thead>
    <tbody></tbody>
  </table>

  <div class="section-title">Rutas</div>
  <table id="routes-table">
    <thead><tr><th>Path</th><th>Upstream</th><th>Auth</th><th>Rate limit</th></tr></thead>
    <tbody></tbody>
  </table>

  <div class="footer">Datos servidos desde /admin/stats, /admin/upstreams y /admin/routes de esta misma instancia.</div>

<script>
async function fetchJson(path) {
  const res = await fetch(path);
  return res.json();
}

function badge(text, cls) {
  const span = document.createElement('span');
  span.className = 'badge ' + cls;
  span.textContent = text;
  return span;
}

async function refresh() {
  try {
    const [stats, upstreams, routes] = await Promise.all([
      fetchJson('/admin/stats'),
      fetchJson('/admin/upstreams'),
      fetchJson('/admin/routes'),
    ]);

    const grid = document.getElementById('stats-grid');
    grid.innerHTML = '';
    const cards = [
      ['Uptime', Math.floor(stats.uptime_seconds) + 's'],
      ['Requests totales', stats.total_requests],
      ['Fallos de gateway', stats.total_gateway_failures],
      ['Rutas configuradas', stats.routes_configured],
      ['Upstreams configurados', stats.upstreams_configured],
    ];
    for (const [label, value] of cards) {
      const div = document.createElement('div');
      div.className = 'stat';
      div.innerHTML = `<div class="label">${label}</div><div class="value">${value}</div>`;
      grid.appendChild(div);
    }

    const upstreamsBody = document.querySelector('#upstreams-table tbody');
    upstreamsBody.innerHTML = '';
    for (const upstream of upstreams) {
      for (const backend of upstream.backends) {
        const tr = document.createElement('tr');
        const cells = [upstream.name, upstream.load_balancer, backend.url, backend.weight];
        cells.forEach(text => {
          const td = document.createElement('td');
          td.textContent = text;
          tr.appendChild(td);
        });

        const healthTd = document.createElement('td');
        healthTd.appendChild(badge(backend.healthy ? 'healthy' : 'unhealthy', backend.healthy ? 'healthy' : 'unhealthy'));
        tr.appendChild(healthTd);

        const circuitTd = document.createElement('td');
        circuitTd.appendChild(badge(backend.circuit_state, backend.circuit_state));
        tr.appendChild(circuitTd);

        const connTd = document.createElement('td');
        connTd.textContent = backend.active_connections;
        tr.appendChild(connTd);

        upstreamsBody.appendChild(tr);
      }
    }

    const routesBody = document.querySelector('#routes-table tbody');
    routesBody.innerHTML = '';
    for (const route of routes) {
      const tr = document.createElement('tr');
      const cells = [route.path, route.upstream, route.auth || '-', route.rate_limited ? 'sí' : 'no'];
      cells.forEach(text => {
        const td = document.createElement('td');
        td.textContent = text;
        tr.appendChild(td);
      });
      routesBody.appendChild(tr);
    }
  } catch (err) {
    console.error('no se pudo refrescar el dashboard', err);
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
